<title>셈법 복습판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 오늘 → 복습 달력 → 규칙 카드. 오늘 할 일이 맨 위 */
:root{--ink:#15202b;--muted:#5a6672;--paper:#f3f5f7;--card:#fff;--line:#dce2e7;--blue:#2a63d4;--amber:#b9850f;--good:#148f68;--bad:#b4442f;--blue-soft:#e8eefb;--amber-soft:#f8efd9;--good-soft:#e2f4ed;
--f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6ebf0;--muted:#9aa6b2;--paper:#0f1419;--card:#171e26;--line:#29323d;--blue:#7ea4ff;--amber:#e3b54a;--good:#4fd1a1;--bad:#ff8a73;--blue-soft:#1a2740;--amber-soft:#2e2614;--good-soft:#12302a;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6ebf0;--muted:#9aa6b2;--paper:#0f1419;--card:#171e26;--line:#29323d;--blue:#7ea4ff;--amber:#e3b54a;--good:#4fd1a1;--bad:#ff8a73;--blue-soft:#1a2740;--amber-soft:#2e2614;--good-soft:#12302a;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:26px}
.brand{font-size:.85rem;color:var(--muted)}.brand b{color:var(--ink);font-weight:800}
h1{font-size:clamp(1.5rem,3.6vw,1.9rem);margin:4px 0 6px;font-weight:800}
h2{font-size:1.08rem;margin:0;font-weight:800}
p{margin:0}.lead{color:var(--muted);max-width:62ch}.small{font-size:.83rem;color:var(--muted)}
section{display:grid;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.today{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:center}
.check input{width:20px;height:20px;accent-color:var(--good)}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.item:first-child{border-top:none;padding-top:0}
.item .t{min-width:0;flex:1}
.tag{font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin-right:6px}
.due{font-family:var(--f-mono);font-size:.8rem}
.late{color:var(--bad)}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.st{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer}
.st.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.st.now{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
form{display:grid;grid-template-columns:120px 1fr 160px auto;gap:8px;align-items:end}
@media (max-width:640px){form{grid-template-columns:1fr 1fr}}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700}
input[type=text],input[type=date],select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
button.main{font:inherit;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{font:inherit;font-size:.82rem;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--muted);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;color:var(--ink);display:grid;gap:6px;align-content:start}
.card .q{font-weight:800}
.card .a{font-size:.9rem;color:var(--muted)}
.card[aria-expanded="false"] .a{display:none}
.card[aria-expanded="false"]::after{content:"눌러서 규칙 보기";font-size:.78rem;color:var(--blue)}
.empty{color:var(--muted);font-size:.9rem}
pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.8rem;background:var(--paper);border-radius:8px;padding:10px;margin:0}
</style>

<div class="wrap">
  <header>
    <div class="brand"><b>셈법</b> · 토익·코테 학습 기록</div>
    <h1>복습판</h1>
    <p class="lead">틀린 문제를 넣으면 1일·3일·7일 뒤 복습 날짜가 자동으로 잡힙니다. 매일 이 페이지를 열어 "오늘 할 복습"만 하면 됩니다.</p>
  </header>

  <section>
    <h2 id="todayh">오늘</h2>
    <div class="box today">
      <label class="check"><input type="checkbox" id="c-toeic"> 토익 30분</label>
      <label class="check"><input type="checkbox" id="c-code"> 코테 30분</label>
      <p class="small" id="orderNote">순서: 토익 → 코테 → 그다음에만 다른 일</p>
    </div>
    <div class="box" id="dueBox"></div>
  </section>

  <section>
    <h2>틀린 문제 추가</h2>
    <form id="add" class="box">
      <label for="f-area">영역<select id="f-area"><option>토익</option><option>코테</option><option>SQL</option></select></label>
      <label for="f-text">무엇을 (문제·유형)<input type="text" id="f-text" placeholder="예: 전치사·접속사 오답 5개"></label>
      <label for="f-date">처음 틀린 날<input type="date" id="f-date"></label>
      <button class="main" type="submit">추가</button>
    </form>
  </section>

  <section>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>전체 복습 목록</h2><button class="ghost" type="button" id="exportBtn">목록 복사</button></div>
    <div class="box" id="allBox"></div>
    <pre id="exportOut" hidden></pre>
    <p class="small">기록은 이 기기의 브라우저에만 저장됩니다. 다른 기기로 옮기거나 노션에 남기려면 "목록 복사"를 쓰세요.</p>
  </section>

  <section>
    <h2>오답 규칙 카드</h2>
    <p class="lead">질문을 먼저 떠올리고, 눌러서 규칙을 확인하세요.</p>
    <div class="cards" id="cards"></div>
  </section>
</div>

<script>
const KEY="sembeop-review-v1";
const STEPS=[1,3,7];
const pad=n=>String(n).padStart(2,"0");
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=ds(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return ds(new Date(y,m-1,d+n));};
const md=s=>`${+s.slice(5,7)}/${+s.slice(8,10)}`;
const SEED=[
 {a:"토익",t:"RC 미니 진단 오답 (전치사·접속사 5, 대명사·관계사 4, 어휘 4, 동사 3, 품사 2)",d:"2026-10-15"},
 {a:"코테",t:"노란불 신호등: 시뮬레이션 + 주기(최소공배수), 백지에서 다시",d:"2026-10-15"},
 {a:"SQL",t:"이름이 없는 동물의 아이디: IS NULL + ORDER BY, 백지에서 다시",d:"2026-10-15"},
 {a:"코테",t:"같은 숫자는 싫어: answer[-1]과 비교, 빈 바구니 먼저 처리",d:"2026-10-16"}
];
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){S=null;}
if(!S){S={items:SEED.map((x,i)=>({id:i+1,...x,done:[false,false,false]})),days:{},next:SEED.length+1};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const day=S.days[today]||(S.days[today]={toeic:false,code:false});
["toeic","code"].forEach(k=>{const el=document.getElementById("c-"+k);el.checked=day[k];el.addEventListener("change",()=>{day[k]=el.checked;save();note();});});
function note(){const n=document.getElementById("orderNote");n.textContent=day.toeic&&day.code?"오늘의 바닥을 채웠습니다. 이제 다른 일을 해도 됩니다.":"순서: 토익 → 코테 → 그다음에만 다른 일";}
document.getElementById("todayh").textContent=`오늘 (${md(today)})`;
function itemHTML(it,showAll){
  const st=STEPS.map((n,i)=>{const dd=addDays(it.d,n);const now=!it.done[i]&&dd<=today;
    return `<button type="button" class="st ${it.done[i]?"done":""} ${now?"now":""}" data-id="${it.id}" data-i="${i}" aria-pressed="${it.done[i]}">${n}일 뒤 · ${md(dd)}${it.done[i]?" ✓":""}</button>`;}).join("");
  const del=showAll?`<button type="button" class="ghost" data-del="${it.id}">지우기</button>`:"";
  return `<div class="item"><div class="t"><span class="tag">${it.a}</span>${it.t}<div class="small">처음 틀린 날 ${md(it.d)}</div></div><div class="stages">${st}${del}</div></div>`;
}
function draw(){
  const due=S.items.filter(it=>STEPS.some((n,i)=>!it.done[i]&&addDays(it.d,n)<=today));
  const late=due.filter(it=>STEPS.some((n,i)=>!it.done[i]&&addDays(it.d,n)<today)).length;
  document.getElementById("dueBox").innerHTML=`<h2 style="font-size:1rem">오늘 할 복습 ${due.length}개${late?` <span class="late">(밀린 것 ${late}개 포함)</span>`:""}</h2>`+
    (due.length?due.map(it=>itemHTML(it,false)).join(""):`<p class="empty">오늘 할 복습이 없습니다. 새 문제를 풀고, 틀리면 아래에 추가하세요.</p>`)+
    `<p class="small">호박색 테두리가 오늘 할 단계입니다. 다 풀었으면 눌러서 완료로 바꾸세요. 같은 문제를 다시 풀 때는 답을 보지 않고 백지에서 시작합니다.</p>`;
  const all=[...S.items].sort((a,b)=>a.d<b.d?1:-1);
  document.getElementById("allBox").innerHTML=all.length?all.map(it=>itemHTML(it,true)).join(""):`<p class="empty">아직 없습니다.</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".st");if(b){const it=S.items.find(x=>x.id==b.dataset.id);it.done[+b.dataset.i]=!it.done[+b.dataset.i];save();draw();return;}
  const d=e.target.closest("[data-del]");if(d){S.items=S.items.filter(x=>x.id!=d.dataset.del);save();draw();}
});
const fd=document.getElementById("f-date");fd.value=today;
document.getElementById("add").addEventListener("submit",e=>{e.preventDefault();const t=document.getElementById("f-text").value.trim();if(!t){document.getElementById("f-text").focus();return;}
  S.items.push({id:S.next++,a:document.getElementById("f-area").value,t,d:fd.value||today,done:[false,false,false]});document.getElementById("f-text").value="";save();draw();});
document.getElementById("exportBtn").addEventListener("click",()=>{const o=document.getElementById("exportOut");
  const txt=["복습 목록 ("+today+")",...S.items.map(it=>`- [${it.a}] ${it.t} / 처음 ${it.d} / `+STEPS.map((n,i)=>`${n}일 ${md(addDays(it.d,n))} ${it.done[i]?"완료":"남음"}`).join(", "))].join("\n");
  o.textContent=txt;o.hidden=false;navigator.clipboard.writeText(txt).catch(()=>{});});
const CARDS=[
 ["전치사·접속사","빈칸 뒤에 동사가 있나?","명사(구)만 → despite, due to, because of, during, throughout, in case of, without / 주어+동사 → although, because, while, once, as long as, provided that, unless"],
 ["대명사·관계사","뒤 문장이 완전한가?","완전 → where/when, 빠짐 → which/who, 바로 명사 → whose, Those who, 문장이 완성되고 '직접' → -self, 명사 앞 → 소유격, 콤마·전치사 뒤 that 불가"],
 ["동사","시간 단서와 진짜 주어는?","By the time/by the end of → 미래완료, since·for+기간 → 현재완료, If/When 절 → 현재시제, Each/Every → 단수, 뒤에 목적어 없으면 be p.p., suggest/request that + 동사원형"],
 ["품사","빈칸은 어느 자리?","관사+___+명사 → 형용사, 관사+___(뒤에 동사·전치사) → 명사, 동사 앞뒤·문장 끝 → 부사, be동사 뒤 → 형용사. friendly·costly·timely·likely는 형용사"],
 ["어휘","짝꿍 표현은?","comply with, conduct a survey, be promoted to, refer to = consult, be responsible for, be eligible for, prior to, on behalf of, in accordance with"],
 ["코테","바로 앞 값과 비교하는 문제?","결과 리스트 맨 끝 answer[-1]과 비교. 리스트가 비었을 때(len(answer)==0)를 먼저 처리"],
 ["SQL","NULL을 찾을 때?","= NULL은 안 됨 → IS NULL / IS NOT NULL. ORDER BY 뒤에는 기준 열"]
];
document.getElementById("cards").innerHTML=CARDS.map((c,i)=>`<button type="button" class="card" id="card${i}" aria-expanded="false"><span class="tag" style="justify-self:start">${c[0]}</span><span class="q">${c[1]}</span><span class="a">${c[2]}</span></button>`).join("");
document.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>c.setAttribute("aria-expanded",c.getAttribute("aria-expanded")==="false")));
note();draw();
</script>
